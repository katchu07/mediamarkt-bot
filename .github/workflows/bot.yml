name: MediaMarkt 24/7 Deal Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # Draait elke 20 minuten automatisch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-outlet:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliotheken en Chromium installeren
        run: |
          pip install playwright playwright-stealth requests
          playwright install --with-deps chromium

      - name: Maak geheugenbestand aan als het nog niet bestaat
        run: touch gevonden_deals.txt

      - name: Start MediaMarkt Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python mediamarkt_scraper.py

      - name: Sla gevonden deals op in het geheugen
        run: |
          git config --global user.name "MediaMarkt Bot"
          git config --global user.email "bot@noreply.github.com"
          git add gevonden_deals.txt
          git diff --staged --quiet || git commit -m "Update gevonden deals"
          git push
          
