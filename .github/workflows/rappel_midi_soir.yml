name: Bot Rappel Midi et Soir

on:
  schedule:
    # Déclenchement tous les jours à 10h00 UTC (12h00 heure de Paris/Bruxelles en été) 
    # et à 18h00 UTC (20h00 heure de Paris/Bruxelles en été)
    - cron: '0 10,18 * * *'
  workflow_dispatch: # Permet de tester manuellement depuis l'onglet Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run bot script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python rappel_midi_soir.py
